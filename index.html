<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gift_7f3a91</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff3f6,#ffd7e2);color:#512331}
.card{width:100%;max-width:390px;background:#fff;border-radius:28px;padding:38px 25px;
text-align:center;box-shadow:0 16px 45px rgba(90,25,45,.16)}
.icon{font-size:60px}h1{font-size:29px;margin:14px 0}
p{font-size:17px;line-height:1.55}.amount{font-size:48px;font-weight:800;color:#e83f69;margin:22px 0}
button{width:100%;border:0;border-radius:50px;padding:17px;margin-top:22px;background:#e83f69;

.hidden{display:none}
.small{font-size:13px;color:#777}
</style>
</head>
<body>
<main class="card">
<section id="s1">
<div class="icon">🎁</div>
<h1>Your Birthday Gift ❤️</h1>
<p>I know your birthday has already gone...</p>
<p>But your gift was a little late. 🥹</p>
<button onclick="show(2)">Tap to Open Your Gift 🎀</button>
</section>

<section id="s2" class="hidden">
<div class="icon">🎂❤️</div>
<h1>Happy Birthday, Shruti!</h1>
<p>A little late, but given with lots of love.</p>
<div class="amount">₹5,000</div>
<p><b>Happy Birthday partner♥️</b></p>

</section>
</main>
<script>
function show(n){
 document.getElementById("s1").classList.add("hidden");
 document.getElementById("s2").classList.remove("hidden");
}
</script>
</body>
</html>
